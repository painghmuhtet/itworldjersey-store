name = "chitoo-ai"
main = "index.js"
compatibility_date = "2026-10-21"

routes = [
  { pattern = "ai.itworldjersey.store", custom_domain = true }
]

[ai]
binding = "AI"

[assets]
directory = "../ai"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Private bucket for customer custom-design uploads.
[[r2_buckets]]
binding = "CUSTOM_DESIGNS"
bucket_name = "itworldjersey-custom-designs"

# Do not bind the public product-image bucket here.
