<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Watch IT WORLD JERSEY live on YouTube.">
  <title>IT WORLD JERSEY | Live</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#090b10;color:#f7f8fb;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(900px,calc(100% - 28px));margin:0 auto;padding:24px 0 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
    .brand{font-weight:900;letter-spacing:.2px}.brand span{color:#ff2547}
    .live{background:#ff2547;color:white;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
    h1{font-size:clamp(26px,5vw,42px);line-height:1.1;margin:16px 0 8px}
    p{color:#aeb6c5;margin:0 0 20px}
    .player{aspect-ratio:16/9;background:#151923;border:1px solid #303747;border-radius:14px;overflow:hidden}
    iframe{width:100%;height:100%;border:0}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    a.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:9px;text-decoration:none;font-weight:800;background:#ff2547;color:#fff}
    a.secondary{background:#171d28;border:1px solid #343c4b}
    footer{border-top:1px solid #252b37;margin-top:28px;padding-top:16px;color:#8f99aa;font-size:12px}
  </style>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="/" style="color:inherit;text-decoration:none">IT WORLD <span>JERSEY</span></a>
      <span class="live">● LIVE STREAM</span>
    </header>
    <h1>Watch Our Live Stream</h1>
    <p>Watch IT WORLD JERSEY live here. If the stream is not live yet, come back when the broadcast starts.</p>
    <div class="player">
      <iframe
        src="https://www.youtube-nocookie.com/embed/FRqJ9GkkbNE?playsinline=1&rel=0"
        title="IT WORLD JERSEY YouTube Live"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
    <div class="actions">
      <a class="btn" href="https://www.youtube.com/live/FRqJ9GkkbNE" target="_blank" rel="noopener">Watch on YouTube ↗</a>
      <a class="btn secondary" href="/shop/">Browse Jerseys</a>
    </div>
    <footer>© <span id="year"></span> IT WORLD JERSEY</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
